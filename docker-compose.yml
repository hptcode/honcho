version: "3.9"

x-honcho-common: &honcho-common

  build:
    context: .
    dockerfile: Dockerfile

  restart: unless-stopped

  environment:

    DB_CONNECTION_URI: ${DB_CONNECTION_URI}

    CACHE_ENABLED: "false"

    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}

    LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY}
    LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY}
    LLM_GEMINI_API_KEY: ${LLM_GEMINI_API_KEY}

    LOG_LEVEL: ${LOG_LEVEL:-INFO}


services:

  honcho-api:

    <<: *honcho-common

    container_name: honcho-api

    entrypoint:
      [
        "sh",
        "docker/entrypoint.sh"
      ]

    expose:
      - "8000"


    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


    networks:
      - coolify



  honcho-deriver:

    <<: *honcho-common

    container_name: honcho-deriver


    entrypoint:
      [
        "/app/.venv/bin/python",
        "-m",
        "src.deriver"
      ]


    depends_on:

      honcho-api:
        condition: service_healthy


    networks:
      - coolify



networks:

  coolify:
    external: true
